services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remi}
      POSTGRES_USER: ${POSTGRES_USER:-remi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remi_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - remi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remi} -d ${POSTGRES_DB:-remi}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  remi_postgres_data:
